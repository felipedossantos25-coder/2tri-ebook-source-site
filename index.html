<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookVerse - Biblioteca</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#000000;
}

header{
    background:#4a148c;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    margin:auto;
    padding:30px 0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.info{
    padding:15px;
}

.info h2{
    font-size:22px;
    margin-bottom:10px;
}

.info p{
    color:#555;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#e91e63;
    color:white;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

button:hover{
    background:#c2185b;
}

.likes{
    margin-top:10px;
    text-align:center;
    font-weight:bold;
    color:#4a148c;
}

footer{
    margin-top:40px;
    background:#4a148c;
    color:white;
    text-align:center;
    padding:20px;
}
</style>

</head>
<body>

<header>
<h1>📚 BookVerse</h1>
<p>Avalie esses títulos conhecidos</p>
</header>

<div class="container">

<div class="grid">

<div class="card">
<img src="https://images.tcdn.com.br/img/img_prod/1271663/dom_casmurro_edicao_de_luxo_almofadada_89_1_038fb70c564eb50f71ea49f6027e827a.jpg">
<div class="info">
<h2>Dom Casmurro</h2>
<p>Machado de Assis</p>
<button onclick="curtir(1)">❤️ Curtir</button>
<div class="likes" id="likes1"></div>
</div>
</div>

<div class="card">
<img src="https://m.media-amazon.com/images/I/91M9xPIf10L.jpg">
<div class="info">
<h2>O Hobbit</h2>
<p>J. R. R. Tolkien</p>
<button onclick="curtir(2)">❤️ Curtir</button>
<div class="likes" id="likes2"></div>
</div>
</div>

<div class="card">
<img src="https://m.media-amazon.com/images/I/61t0bwt1s3L._AC_UF1000,1000_QL80_AIweblab1381794,T1_.jpg">
<div class="info">
<h2>1984</h2>
<p>George Orwell</p>
<button onclick="curtir(3)">❤️ Curtir</button>
<div class="likes" id="likes3"></div>
</div>
</div>

<div class="card">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqDtCgnJqo8eCjOpc41nsQcFbeI4RVCrbe2mr9QBC8CA&s=10">
<div class="info">
<h2>Harry Potter</h2>
<p>J. K. Rowling</p>
<button onclick="curtir(4)">❤️ Curtir</button>
<div class="likes" id="likes4"></div>
</div>
</div>

</div>

</div>

<footer>
© 2026 BookVerse
</footer>

<script>

function carregar(){
    for(let i=1;i<=4;i++){
        let likes = localStorage.getItem("livro"+i);

        if(likes==null){
            likes=0;
            localStorage.setItem("livro"+i,0);
        }

        document.getElementById("likes"+i).innerHTML=
        "❤️ "+likes+" curtidas";
    }
}

function curtir(id){

    let likes=parseInt(localStorage.getItem("livro"+id));

    likes++;

    localStorage.setItem("livro"+id,likes);

    document.getElementById("likes"+id).innerHTML=
    "❤️ "+likes+" curtidas";

}

carregar();

</script>

</body>
</html>
